apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-ui
  labels:
    app: chat-ui
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chat-ui
  template:
    metadata:
      labels:
        app: chat-ui
        version: v1
    spec:
      containers:
      - name: chat-ui
        image: chat-ui:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: MEMORY_LIMIT
          value: "512"
        - name: NEXT_PUBLIC_APP_NAME
          valueFrom:
            configMapKeyRef:
              name: chat-ui-config
              key: app-name
        - name: NEXT_PUBLIC_N8N_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: chat-ui-secrets
              key: n8n-webhook-url
        - name: NEXT_PUBLIC_ANALYTICS_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: chat-ui-secrets
              key: analytics-endpoint
        - name: NEXT_PUBLIC_ANALYTICS_API_KEY
          valueFrom:
            secretKeyRef:
              name: chat-ui-secrets
              key: analytics-api-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: nextjs-cache
          mountPath: /app/.next
      volumes:
      - name: tmp
        emptyDir: {}
      - name: nextjs-cache
        emptyDir: {}
      securityContext:
        fsGroup: 1001
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: chat-ui-service
  labels:
    app: chat-ui
spec:
  selector:
    app: chat-ui
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-ui-config
data:
  app-name: "n8n Chat UI"
  primary-color: "#3b82f6"
  secondary-color: "#64748b"
  font-family: "Inter"
  analytics-sample-rate: "1.0"

---
apiVersion: v1
kind: Secret
metadata:
  name: chat-ui-secrets
type: Opaque
stringData:
  n8n-webhook-url: "https://your-n8n-instance.com/webhook/your-webhook-id"
  analytics-endpoint: "https://your-analytics-endpoint.com/events"
  analytics-api-key: "your-analytics-api-key"

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chat-ui-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - chat.example.com
    secretName: chat-ui-tls
  rules:
  - host: chat.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: chat-ui-service
            port:
              number: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chat-ui-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chat-ui
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80